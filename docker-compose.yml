services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biocareplus
      POSTGRES_USER: biocare
      POSTGRES_PASSWORD: biocare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biocare -d biocareplus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
